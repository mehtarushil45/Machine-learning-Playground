@startuml
title ML Playground — Activity Diagram
caption Dataset ingestion to asynchronous training results
skinparam backgroundColor white
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam activityStyle roundedBox
skinparam ArrowColor #766B8A
skinparam activity {
  BackgroundColor #FFFFFF
  BorderColor #4B3B7C
  FontColor #241D35
  DiamondBackgroundColor #FFF7E8
  DiamondBorderColor #B07C27
  StartColor #4B3B7C
  EndColor #211A34
  BarColor #4B3B7C
}

start
|Platform User|
:Upload a CSV or choose a ready-made example;

|Web App|
:Validate CSV and parse dataset;
while (CSV invalid?) is (yes)
  :Display validation error;
  |Platform User|
  :Choose another file or example;
  |Web App|
  :Validate CSV and parse dataset;
endwhile (no)
:Initialize active dataset project;
:Compute or retrieve dataset profile and quality report;
:Generate algorithm recommendations;

|Platform User|
:Review profile and quality findings;
:Select target and input features;
:Configure algorithm, preprocessing and train/test split;

|Web App|
:Validate training configuration;
while (Settings invalid?) is (yes)
  :Show inline validation errors;
  |Platform User|
  :Correct target, features or settings;
  |Web App|
  :Validate training configuration;
endwhile (no)
:Submit training job request;

|FastAPI API|
:Validate request and create owner-scoped job record;
:Queue Celery task and return job ID;

fork
  |Web App|
  :Monitor job status via SSE or polling;
  while (Terminal status received?) is (no)
    :Read latest job status and progress;
  endwhile (yes)
fork again
  |Celery Worker|
  :Mark job RUNNING;
  :Load and validate training dataset;
  :Detect task type, build preprocessing pipeline and split data;
  :Tune and cross-validate when configured; fit final estimator;
  :Compute evaluation metrics and feature importance;
  :Generate report, save model artifact, register model and save experiment;
  if (Training pipeline succeeds?) then (yes)
    :Persist COMPLETED status, metrics and artifact references;
  else (no)
    :Persist FAILED status and error details;
  endif
end fork

|Web App|
if (Job status is COMPLETED?) then (yes)
  :Display metrics, model results and feature importance;
else (no)
  :Display failure or cancellation status;
endif
stop
@enduml
