# ML Platform — Docker Compose
#
# Run from the repository root:
#   docker compose -f infra/docker-compose.yml up
#
# Requires a .env file at the repository root (copy from .env.example).
# All env_file paths below are relative to THIS FILE's directory (infra/).

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Database Migration (one-shot) ───────────────────────────────────────────
  # Runs `alembic upgrade head` once, then exits with code 0.
  # Both api and worker depend on this via service_completed_successfully so
  # they never start against an un-migrated schema.
  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    working_dir: /app/services/api
    restart: "no"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app:/app/services/api
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/mlplatform
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app:/app/services/api
      # Docker networking overrides (overrides ../.env local settings)
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/mlplatform
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/services/api/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: celery -A services.worker.celery_app worker --loglevel=info
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app:/app/services/api
      # Docker networking overrides (overrides ../.env local settings)
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/mlplatform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - uploads_data:/app/services/api/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A services.worker.celery_app inspect ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── MinIO Object Storage ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  uploads_data:
    driver: local
